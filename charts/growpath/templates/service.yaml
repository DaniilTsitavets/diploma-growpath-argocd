{{- if eq .Values.mode "service" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "growpath.fullname" . }}
  labels:
    {{- include "growpath.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "growpath.selectorLabels" . | nindent 4 }}
{{- end }}
