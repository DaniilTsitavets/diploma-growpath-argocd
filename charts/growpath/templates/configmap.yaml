{{- if include "growpath.hasConfig" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "growpath.fullname" . }}
  labels:
    {{- include "growpath.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  {{- include "growpath.configData" . | nindent 2 }}
{{- end }}
