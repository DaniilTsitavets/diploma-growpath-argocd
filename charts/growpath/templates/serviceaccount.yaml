{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "growpath.serviceAccountName" . }}
  labels:
    {{- include "growpath.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
