# Values for the argo-cd chart (argoproj/argo-helm 10.19.0, Argo CD v3.6.2).
# Applied once by hand: helm install argocd argo/argo-cd -n argocd --create-namespace \
#   --version 10.19.0 -f bootstrap/argocd-values.yaml
# After the first install Argo CD manages itself: platform/apps/argocd.yaml reuses this file,
# so the manual install and the self-managed release must use the same chart version and values.
# Everything runs on the `system` managed node group (taint CriticalAddonsOnly,
# label karpenter.sh/controller=true). Resource numbers are estimates, not measurements.

global:
  # No NetworkPolicy for now (author's decision); the chart default would create default-deny ones.
  networkPolicy:
    create: false
  nodeSelector:
    karpenter.sh/controller: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

dex:
  enabled: false

notifications:
  enabled: false

configs:
  cm:
    url: https://argocd.growpath.social
  params:
    # TLS ends at the ALB, so the server speaks plain HTTP behind it.
    server.insecure: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Internal ALB (group admin-tools, shared with Grafana later), reachable only through Tailscale.
  # The host rule is enough for the certificate: LBC discovers the ACM certificate by host name, and
  # ExternalDNS (EKS add-on) creates the Route 53 record from the same host.
  ingress:
    enabled: true
    ingressClassName: alb
    hostname: argocd.growpath.social
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: admin-tools
      alb.ingress.kubernetes.io/tags: ingress-name=admin-tools
      alb.ingress.kubernetes.io/security-groups: sg-0f505ddbccbd8ce84
      alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/healthcheck-path: /healthz

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
