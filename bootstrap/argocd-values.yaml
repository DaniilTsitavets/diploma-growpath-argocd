# Used for the manual install and by platform/apps/argocd.yaml (self-managed); keep the chart version in sync.

global:
  # The chart default creates default-deny NetworkPolicies.
  networkPolicy:
    create: false
  nodeSelector:
    karpenter.sh/controller: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

dex:
  enabled: false

notifications:
  enabled: false

configs:
  cm:
    url: https://argocd.growpath.social
  params:
    # TLS ends at the ALB, so the server speaks plain HTTP behind it.
    server.insecure: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Internal ALB shared by the admin tools (group admin-tools). The ACM certificate is discovered by host
  # and ExternalDNS creates the DNS record from the same host.
  ingress:
    enabled: true
    ingressClassName: alb
    hostname: argocd.growpath.social
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: admin-tools
      alb.ingress.kubernetes.io/tags: ingress-name=admin-tools
      alb.ingress.kubernetes.io/security-groups: sg-0f505ddbccbd8ce84
      alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/healthcheck-path: /healthz

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
