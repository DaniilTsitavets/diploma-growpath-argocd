apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Platform components (Karpenter, Argo CD itself, later ESO, LBC, Reloader, observability)
  sourceRepos:
    - https://github.com/DaniilTsitavets/diploma-growpath-argocd.git
    - https://argoproj.github.io/argo-helm
    - https://aws.github.io/eks-charts
    - public.ecr.aws/karpenter
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kube-system
  # Cluster-scoped kinds that the platform charts create. Extend per step when a new chart
  # (LBC, ESO, Reloader, ...) brings its own cluster-scoped resources.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: karpenter.sh
      kind: NodePool
    - group: karpenter.k8s.aws
      kind: EC2NodeClass
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
    - group: elbv2.k8s.aws
      kind: IngressClassParams
