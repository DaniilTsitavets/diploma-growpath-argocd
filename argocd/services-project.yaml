apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: GrowPath services
  sourceRepos:
    - https://github.com/DaniilTsitavets/diploma-growpath-argocd.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: growpath-services
  clusterResourceWhitelist:
    # Required by CreateNamespace.
    - group: ""
      kind: Namespace
      name: growpath-services
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: networking.k8s.io
      kind: Ingress
    - group: policy
      kind: PodDisruptionBudget
    - group: external-secrets.io
      kind: ExternalSecret
    - group: monitoring.coreos.com
      kind: ServiceMonitor
