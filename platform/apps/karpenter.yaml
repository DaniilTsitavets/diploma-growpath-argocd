apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.15.3
      helm:
        releaseName: karpenter
        # CRDs come from the karpenter-crd Application (wave 1); the chart also ships its own.
        skipCrds: true
        valueFiles:
          - $values/platform/values/karpenter.yaml
    - repoURL: https://github.com/DaniilTsitavets/diploma-growpath-argocd.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
