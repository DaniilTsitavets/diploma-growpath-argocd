apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    # Before every Application that deploys into one of these namespaces.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: admin
  source:
    repoURL: https://github.com/DaniilTsitavets/diploma-growpath-argocd.git
    targetRevision: main
    path: platform/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Namespaces are never deleted automatically.
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
