apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    # Its webhooks fail closed for every Service and Ingress, so LBC must be healthy before
    # anything that creates those (ESO, Reloader, observability, services).
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 3.6.3
      helm:
        releaseName: aws-load-balancer-controller
        valueFiles:
          - $values/platform/values/aws-load-balancer-controller.yaml
    - repoURL: https://github.com/DaniilTsitavets/diploma-growpath-argocd.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # The chart generates the webhook CA and certificate on every render (genCA), so Argo would see a
  # permanent diff and rotate them. Keep whatever was created on the first sync.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: aws-load-balancer-tls
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
