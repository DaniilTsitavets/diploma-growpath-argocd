apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.15.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/values/external-secrets.yaml
    - repoURL: https://github.com/DaniilTsitavets/diploma-growpath-argocd.git
      targetRevision: main
      ref: values
    # Self-signed Issuer for the webhook certificate (cert-manager runs outside GitOps).
    - repoURL: https://github.com/DaniilTsitavets/diploma-growpath-argocd.git
      targetRevision: main
      path: platform/external-secrets/issuer
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too big for client-side apply annotations.
      - ServerSideApply=true
