# Karpenter must not run on nodes it manages, so it stays on the `system` group.
settings:
  clusterName: growpath
  interruptionQueue: growpath-karpenter

# The name must match the Pod Identity association (kube-system/karpenter).
serviceAccount:
  create: true
  name: karpenter

replicas: 2

nodeSelector:
  karpenter.sh/controller: "true"

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

# The chart default of 1 CPU / 1Gi is too much for the system nodes.
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
