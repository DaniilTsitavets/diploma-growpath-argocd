# The ServiceAccount name must match the Pod Identity association (external-secrets/external-secrets).
installCRDs: true

serviceAccount:
  create: true
  name: external-secrets

nodeSelector:
  karpenter.sh/controller: "true"

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

webhook:
  nodeSelector:
    karpenter.sh/controller: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
  # Certificate from cert-manager (Issuer in platform/external-secrets/issuer); the built-in cert controller is off.
  certManager:
    enabled: true
    addInjectorAnnotations: true
    cert:
      create: true
      issuerRef:
        group: cert-manager.io
        kind: Issuer
        name: external-secrets-selfsigned

certController:
  create: false
