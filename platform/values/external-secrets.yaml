# Values for the external-secrets chart (https://charts.external-secrets.io 2.15.0).
# Runs on the managed `system` group. IAM comes from Pod Identity (external-secrets/external-secrets, set
# up in Terraform), so the ServiceAccount has no role-arn annotation.
installCRDs: true

serviceAccount:
  create: true
  name: external-secrets

nodeSelector:
  karpenter.sh/controller: "true"

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

# Estimates, to be measured after the first deploy.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

webhook:
  nodeSelector:
    karpenter.sh/controller: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
  # The webhook certificate comes from cert-manager (installed by Terraform as a cluster add-on); the Issuer
  # is in platform/external-secrets/issuer. The built-in certificate controller is not needed then.
  certManager:
    enabled: true
    addInjectorAnnotations: true
    cert:
      create: true
      issuerRef:
        group: cert-manager.io
        kind: Issuer
        name: external-secrets-selfsigned

certController:
  create: false
