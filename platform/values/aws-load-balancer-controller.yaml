# The ServiceAccount name must match the Pod Identity association (kube-system/aws-load-balancer-controller).
clusterName: growpath
region: eu-north-1
# Pods cannot read IMDS (hop limit 1), so the VPC id is set explicitly.
vpcId: vpc-07d0ab5b7b5e9d3c5

replicaCount: 2

serviceAccount:
  create: true
  name: aws-load-balancer-controller

nodeSelector:
  karpenter.sh/controller: "true"

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: aws-load-balancer-controller
        app.kubernetes.io/instance: aws-load-balancer-controller

# Webhook certificates from cert-manager; genCA in the template differs on every render.
enableCertManager: true

# The Service mutator webhook fails closed for every Service.
enableServiceMutatorWebhook: false

# Stops the controller from probing the WAF and Shield APIs.
enableShield: false
enableWaf: false
enableWafv2: false
