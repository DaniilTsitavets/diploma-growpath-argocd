# Cluster-wide store over AWS Secrets Manager. No `auth` block: the controller uses the default credential
# chain, which on EKS is Pod Identity (external-secrets/external-secrets). What the role may read is limited
# in Terraform; `conditions` limits which namespaces can reference this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
  conditions:
    - namespaces:
        - growpath-services
        - monitoring
