# No auth block: the default credential chain resolves Pod Identity. `conditions` limits the namespaces that can use the store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
  conditions:
    - namespaces:
        - growpath-services
        - monitoring
