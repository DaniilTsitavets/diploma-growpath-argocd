apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Floating alias: new AMIs roll out as drift. Pin a version here if that is unwanted.
  amiSelectorTerms:
    - alias: al2023@latest
  role: growpath-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: growpath
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: growpath
  # Karpenter cannot detect prefix delegation, so the pod limit is set by hand (the VPC CNI
  # setting itself comes from Terraform). Without it nodes are capped by the ENI limit.
  kubelet:
    maxPods: 110
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
