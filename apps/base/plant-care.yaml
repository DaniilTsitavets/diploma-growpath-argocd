env:
  PLANT_CARE_LOG_LEVEL: INFO

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 192Mi

ingress:
  enabled: true
  groupOrder: 20
  paths:
    - path: /v1/plants
      pathType: Prefix
    - path: /v1/journals
      pathType: Prefix
    - path: /v1/updates
      pathType: Prefix
